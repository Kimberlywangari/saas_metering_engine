[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saas-metering-engine"
version = "0.1.0"
description = "SaaS Subscription & Tenant Metering Engine"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0,<6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "coverage>=7.4",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
testpaths = ["apps"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]
